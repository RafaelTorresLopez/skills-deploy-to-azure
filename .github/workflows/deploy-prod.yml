name: Deploy to production

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_REGISTRY_URL: ghcr.io
  DOCKER_IMAGE_NAME: rafaeltorreslopez-azure-ttt
  AZURE_WEBAPP_NAME: RafaelTorresLopez-ttt-app

jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Install dependencies and build webpack
        run: |
          npm install
          npm run build

      - name: Upload webpack artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webpack-artifacts
          path: public/
          if-no-files-found: error

  Build-Docker-Image:
    name: Build image and store in GHCR
    runs-on: ubuntu-latest
    needs: build

    outputs:
      image: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download webpack artifacts
        uses: actions/download-artifact@v4
        with:
          name: webpack-artifacts
          path: public/

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY_URL }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REGISTRY_URL }}/${{ github.repository }}/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  Deploy-to-Azure:
    name: Deploy app container to Azure
    runs-on: ubuntu-latest
    needs: Build-Docker-Image

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Show image to deploy
        env:
          DEPLOY_IMAGE: ${{ needs.Build-Docker-Image.outputs.image }}
        run: |
          if [ -z "$DEPLOY_IMAGE" ]; then
            echo "No se ha recibido la referencia de la imagen."
            exit 1
          fi

          printf 'Imagen que se desplegará: %s\n' "$DEPLOY_IMAGE"

      - name: Deploy web app container
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: production
          images: ${{ needs.Build-Docker-Image.outputs.image }}

      - name: Logout from Azure
        if: always()
        run: az logout
